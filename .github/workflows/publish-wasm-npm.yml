name: Publish WASM to npm

on:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build_wasm:
    name: wasm build
    runs-on: ubuntu-latest
    environment: publish-npm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Build Docker Environment
        run: sudo docker compose up
        working-directory: box2d-wasm/
      - name: Build Box2D wasm
        working-directory: box2d-wasm/
        run: |
          sudo docker compose run --rm builder ./generate_release.sh
          sudo docker compose run --rm builder ./make.sh

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing (OIDC) requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npmjs
        working-directory: box2d-wasm/dist
        run: npm publish